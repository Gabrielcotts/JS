<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apresentação pessoal</title>
</head>

<body>
    <h1>Minha Apresentação</h1>

    <script>
        var nome = window.prompt("Qual é o seu nome?");
        var idade = window.prompt("Qual é a sua idade?");
        var cidade = window.prompt("Qual cidade você mora?");
        var linguagemProgramacao = window.prompt("Qual linguagem de programação é a sua favorita?")

        window.alert(`Olá, ${nome}!
Você tem ${idade} anos, mora na ${cidade} e minha linguagem favorita é ${linguagemProgramacao} !`);
    </script>

</body>

</html>
